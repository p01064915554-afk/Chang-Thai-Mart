<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chang Thai Mart</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Thai",sans-serif;
  background:#f4f7f4;
  color:#142018;
}

header{
  background:#ffffff;
  padding:25px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
}

header h1{
  margin:0;
  font-size:30px;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

#langBtn{
  background:#16833d;
  color:white;
  padding:13px 20px;
  border-radius:18px;
  font-size:17px;
}

main{
  max-width:900px;
  margin:auto;
}

.hero{
  margin:20px 14px;
  padding:30px 22px;
  background:#eaf7ee;
  border-radius:25px;
}

.hero h2{
  font-size:30px;
  margin:0 0 12px;
}

.hero p{
  font-size:19px;
  margin:0;
}

.section{
  background:white;
  margin:18px 14px;
  padding:22px;
  border-radius:25px;
}

.section h2{
  font-size:28px;
  margin:0 0 22px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.product{
  border:1px solid #e5e5e5;
  border-radius:20px;
  overflow:hidden;
  background:#fff;
}

.product-image{
  width:100%;
  height:250px;
  object-fit:contain;
  background:#f7f7f7;
  display:block;
}

.product-info{
  padding:16px;
}

.product h3{
  margin:0 0 8px;
  font-size:20px;
  line-height:1.4;
}

.product-detail{
  color:#666;
  margin-bottom:10px;
  font-size:16px;
}

.price{
  font-size:22px;
  font-weight:bold;
  margin-bottom:14px;
}

.addBtn{
  width:100%;
  background:#16833d;
  color:white;
  padding:14px;
  border-radius:14px;
  font-size:18px;
}

.cart-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.cart-name{
  flex:1;
}

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.smallBtn{
  width:35px;
  height:35px;
  border-radius:9px;
  background:#16833d;
  color:white;
  font-size:20px;
}

.cart-price{
  min-width:100px;
  text-align:right;
  font-weight:bold;
}

.total{
  margin-top:20px;
  font-size:25px;
  font-weight:bold;
}

.empty{
  font-size:17px;
  color:#666;
}

input,
textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:15px;
  padding:16px;
  font-size:17px;
  margin-bottom:13px;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.orderBtn{
  width:100%;
  background:#06c755;
  color:white;
  padding:17px;
  border-radius:16px;
  font-size:20px;
}

.lineInfo{
  text-align:center;
  color:#666;
  margin-top:12px;
  font-size:14px;
}

@media(max-width:600px){

  header h1{
    font-size:23px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .product-image{
    height:260px;
  }

  .cart-row{
    flex-wrap:wrap;
  }
}
</style>
</head>

<body>

<header>

<h1>🇹🇭 Chang Thai Mart</h1>

<button
id="langBtn"
onclick="toggleLanguage()">
ไทย
</button>

</header>


<main>

<section class="hero">

<h2 id="storeTitle">
창타이마트
</h2>

<p id="storeText">
태국 식품을 편리하게 주문하세요
</p>

</section>


<section class="section">

<h2 id="productTitle">
상품
</h2>

<div
class="products"
id="products">
</div>

</section>


<section class="section">

<h2 id="cartTitle">
장바구니
</h2>

<div id="cart"></div>

</section>


<section class="section">

<h2 id="orderTitle">
주문하기
</h2>

<input
id="name"
placeholder="이름">

<input
id="phone"
type="tel"
placeholder="전화번호">

<textarea
id="address"
placeholder="주소 / 요청사항">
</textarea>

<button
class="orderBtn"
id="orderBtn"
onclick="submitOrder()">
LINE으로 주문하기
</button>

<div
class="lineInfo"
id="lineInfo">

LINE에서 changthaimart를 선택하여 주문서를 보내주세요.

</div>

</section>

</main>


<script>

const LINE_ID="changthaimart";
const ORDER_API="https://script.google.com/macros/s/AKfycbxUbqudSHEM8-jtcQUTLn4847WyZxCrwb5fUCyeAXDHwXxS3rG33D7pUAbm184cVLeClQ/exec";
let productStock = [];
const products=[

{
  ko:"M-150 에너지 드링크",
  th:"เครื่องดื่มชูกำลัง M-150",
  detailKo:"50개",
  detailTh:"50 ขวด",
  price:59000,
  image:"29094.jpg"
},
 
{
  ko:"락타소이 오리지널 두유 250ml",
  th:"แลคตาซอย ออริจินัล 250 มล.",
  detailKo:"36개",
  detailTh:"36 กล่อง",
  price:32000,
  image:"29095.jpg"
}

];


let language="ko";

let cart={};


const text={

ko:{
 button:"ไทย",
 store:"창타이마트",
 description:"태국 식품을 편리하게 주문하세요",
 products:"상품",
 add:"장바구니 담기",
 cart:"장바구니",
 empty:"장바구니가 비어 있습니다.",
 total:"합계",
 order:"주문하기",
 name:"이름",
 phone:"전화번호",
 address:"주소 / 요청사항",
 submit:"LINE으로 주문하기",
 info:"LINE에서 changthaimart를 선택하여 주문서를 보내주세요.",
 emptyAlert:"상품을 먼저 장바구니에 담아주세요.",
 formAlert:"이름, 전화번호, 주소/요청사항을 입력해주세요."
},

th:{
 button:"한국어",
 store:"ช้างไทยมาร์ท",
 description:"สั่งซื้อสินค้าไทยได้ง่ายๆ",
 products:"สินค้า",
 add:"ใส่ตะกร้า",
 cart:"ตะกร้าสินค้า",
 empty:"ไม่มีสินค้าในตะกร้า",
 total:"รวม",
 order:"สั่งซื้อ",
 name:"ชื่อ",
 phone:"เบอร์โทรศัพท์",
 address:"ที่อยู่ / คำขอเพิ่มเติม",
 submit:"สั่งซื้อทาง LINE",
 info:"กรุณาเลือก changthaimart ใน LINE แล้วส่งรายการสั่งซื้อ",
 emptyAlert:"กรุณาใส่สินค้าในตะกร้าก่อน",
 formAlert:"กรุณากรอกชื่อ เบอร์โทร และที่อยู่"
}

};


function money(number){

return "₩"+
number.toLocaleString("ko-KR");

}

async function loadProductStock() {
  try {
    const response = await fetch(
      ORDER_API + "?action=getProducts"
    );
    const result = await response.json();

    if (!result.success || !Array.isArray(result.products)) {
      console.error("상품 정보 불러오기 실패", result);
      return;
    }
productStock = result.products;
    productStock.forEach((item, index) => {
  if (index >= products.length) {
    products.push({
      ko: item.name,
      th: item.name,
      detailKo: "",
      detailTh: "",
      price: Number(item.price),
      stock: Number(item.stock),
      image: item.imageUrl || item.image || ""
    });
  }
});
   

    productStock.forEach((item, index) => {
      if (products[index]) {
        products[index].price = Number(item.price);
        products[index].stock = Number(item.stock);
      }
    });

    renderProducts();
  } catch (error) {
    console.error("상품 정보 연결 오류", error);
  }
}
function renderProducts(){

const box=
document.getElementById("products");

box.innerHTML="";


products.forEach((p,index)=>{

const detail=
language==="ko"
?p.detailKo
:p.detailTh;


box.innerHTML+=`

<div class="product">

<img
class="product-image"
src="${p.image}"
alt="${p[language]}">

<div class="product-info">

<h3>
${p[language]}
</h3>

<div class="product-detail">
${detail}
</div>

<div class="price">
${money(p.price)}
</div>

<button
class="addBtn" style="${Number(p.stock) <= 0 ? 'background-color:#999;cursor:not-allowed;' : ''}"
onclick="addCart(${index})" ${Number(p.stock) <= 0 ? 'disabled' : ''}>

${Number(p.stock) <= 0 ? (language === "ko" ? "품절" : "สินค้าหมด") : text[language].add}

</button>

</div>

</div>

`;

});

}


function addCart(index){

cart[index]=
(cart[index]||0)+1;

renderCart();

}


function decrease(index){

if(!cart[index]) return;

cart[index]--;

if(cart[index]<=0){

delete cart[index];

}

renderCart();

}


function increase(index){

cart[index]=
(cart[index]||0)+1;

renderCart();

}


function renderCart(){

const box=
document.getElementById("cart");

const keys=
Object.keys(cart);


if(keys.length===0){

box.innerHTML=`

<div class="empty">

${text[language].empty}

</div>

<div class="total">

${text[language].total} ₩0

</div>

`;

return;

}


let html="";

let total=0;


keys.forEach(key=>{

const index=
Number(key);

const p=
products[index];

const qty=
cart[index];

const subtotal=
p.price*qty;

total+=subtotal;


html+=`

<div class="cart-row">

<div class="cart-name">

${p[language]}

</div>


<div class="controls">

<button
class="smallBtn"
onclick="decrease(${index})">

−

</button>

<strong>
${qty}
</strong>

<button
class="smallBtn"
onclick="increase(${index})">

+

</button>

</div>


<div class="cart-price">

${money(subtotal)}

</div>

</div>

`;

});


html+=`

<div class="total">

${text[language].total}

${money(total)}

</div>

`;


box.innerHTML=html;

}


function toggleLanguage(){

language=
language==="ko"
?"th"
:"ko";

document.documentElement.lang=
language==="ko"
?"ko"
:"th";

updateLanguage();

}


function updateLanguage(){

const t=
text[language];

document.getElementById("langBtn").textContent=
t.button;

document.getElementById("storeTitle").textContent=
t.store;

document.getElementById("storeText").textContent=
t.description;

document.getElementById("productTitle").textContent=
t.products;

document.getElementById("cartTitle").textContent=
t.cart;

document.getElementById("orderTitle").textContent=
t.order;

document.getElementById("name").placeholder=
t.name;

document.getElementById("phone").placeholder=
t.phone;

document.getElementById("address").placeholder=
t.address;

document.getElementById("orderBtn").textContent=
t.submit;

document.getElementById("lineInfo").textContent=
t.info;

renderProducts();

renderCart();

}


function submitOrder(){

const t=
text[language];

const name=
document
.getElementById("name")
.value
.trim();

const phone=
document
.getElementById("phone")
.value
.trim();

const address=
document
.getElementById("address")
.value
.trim();


if(Object.keys(cart).length===0){

alert(t.emptyAlert);

return;

}


if(!name || !phone || !address){

alert(t.formAlert);

return;

}


let total=0;

let items="";


Object.keys(cart).forEach(key=>{

const index=
Number(key);

const p=
products[index];

const qty=
cart[index];

const subtotal=
p.price*qty;

total+=subtotal;


items+=
"• "+
p.ko+
" / "+
p.th+
" x "+
qty+
" = "+
money(subtotal)+
"\n";

});


const orderMessage=

`🛒 Chang Thai Mart 주문

--------------------

${items}

--------------------

💰 총금액 / รวม
${money(total)}

👤 이름 / ชื่อ
${name}

📞 전화번호 / เบอร์โทร
${phone}

🏠 주소·요청사항 / ที่อยู่
${address}

--------------------

LINE ID: ${LINE_ID}`;


const lineURL = "https://line.me/R/msg/text/?" +
encodeURIComponent(orderMessage);




/* 주문 후 장바구니 초기화 */
const orderNumber = "CTM-" + new Date().getTime();

const productNames = [];
let totalQuantity = 0;

Object.keys(cart).forEach(key => {
  const index = Number(key);
  const p = products[index];
  const qty = cart[index];

  productNames.push(p.ko + " x " + qty);
  totalQuantity += qty;
});

const orderData = {
  orderNumber: orderNumber,
  name: name,
  phone: phone,
  address: address,
  products: productNames.join(", "),
  quantity: totalQuantity,
  total: total
};

const formData = new URLSearchParams();

formData.append("orderNumber", orderData.orderNumber);
formData.append("name", orderData.name);
formData.append("phone", orderData.phone);
formData.append("address", orderData.address);
formData.append("products", orderData.products);
formData.append("quantity", orderData.quantity);
formData.append("total", orderData.total);

fetch(ORDER_API, {
  method: "POST",
  mode: "no-cors",
  body: formData
});

alert("주문이 접수되었습니다.");

cart = {};
renderCart();

const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

if (isMobile) {
  window.location.href = lineURL;
} else {
  navigator.clipboard.writeText(orderMessage);
  alert("주문내용이 복사되었습니다. LINE에서 붙여넣어 전송해주세요.");
 
}
}
 

updateLanguage();
loadProductStock();
  
</script>

</body>
</html>
