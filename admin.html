<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chang Thai Mart 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
    }

    header {
      background: #07883f;
      color: white;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #666;
      font-size: 15px;
    }

    .card strong {
      font-size: 27px;
    }

    .orders {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f7f7f7;
    }

    .status {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    @media (max-width: 700px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🛒 Chang Thai Mart 관리자</h1>
</header>

<div class="container">

  <div class="summary">

    <div class="card">
      <h3>신규 주문</h3>
      <strong>0건</strong>
    </div>

    <div class="card">
      <h3>오늘 주문</h3>
      <strong>0건</strong>
    </div>

    <div class="card">
      <h3>오늘 매출</h3>
      <strong>₩0</strong>
    </div>

  </div>

  <div class="orders">

    <h2>주문 관리</h2>

    <table>
      <thead>
        <tr>
          <th>주문일시</th>
          <th>주문번호</th>
          <th>고객</th>
          <th>전화번호</th>
          <th>상품</th>
          <th>수량</th>
          <th>금액</th>
          <th>상태</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td colspan="8">
            Google Sheets 주문 데이터를 연결할 준비가 되었습니다.
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>

</body>
</html>
