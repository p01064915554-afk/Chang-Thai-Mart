<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chang Thai Mart 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      font-family: Arial, "Noto Sans KR", sans-serif;
      color: #222;
    }

    header {
      background: #07883f;
      color: white;
      padding: 22px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin: 0 0 10px;
      color: #666;
      font-size: 15px;
    }

    .card strong {
      font-size: 27px;
    }

    .orders {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 850px;
    }

    th, td {
      padding: 14px 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    th {
      background: #f7f7f7;
    }

    .status {
      padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    @media (max-width: 700px) {
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div id="loginScreen" style="max-width:400px;margin:100px auto;padding:30px;background:white;border-radius:12px;text-align:center;">
  <h2>🔐 Chang Thai Mart 관리자 로그인</h2>
  <p>관리자 비밀번호를 입력하세요.</p>
  <input type="password" id="loginPassword" placeholder="관리자 비밀번호"
    style="width:100%;padding:12px;margin:15px 0;">
  <button onclick="adminLogin()"
    style="background:#07883f;color:white;padding:12px 30px;border:0;border-radius:6px;cursor:pointer;">
    로그인
  </button>
</div>  

<div id="adminContent" style="display:none;">
<header>
 
<button onclick="adminLogout()" style="float:right;background:white;color:#07883f;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">로그아웃</button>

  <h1>🛒 Chang Thai Mart 관리자</h1>
</header>

<div class="container">

  <div class="summary">

    <div class="card">
      <h3>신규 주문</h3>
     <strong id="newOrders">0건</strong>
    </div>

    <div class="card">
      <h3>오늘 주문</h3>
  <strong id="todayOrders">0건</strong>
    </div>

    <div class="card">
      <h3>오늘 매출</h3>
      <strong id="todaySales">₩0</strong>
    </div>

  </div>
  </div>
<div class="orders" id="productManagement">
  <h2>📦 상품 관리</h2>
<table>
  <thead>
    <tr>
      <th>상품명</th>
      <th>판매가격</th>
      <th>재고수량</th>
      <th>관리</th>
    </tr>
  </thead>
  <tbody id="productList">
   <tr>
  <td>M-150 에너지드링크 50개입</td>
  <td>₩60,000</td>
  <td>미설정</td>
<td><button onclick="editProduct(0)">수정</button></td>
</tr>
<tr>
  <td>락타소이 오리지널 250ml 36개입</td>
  <td>₩32,000</td>
  <td>미설정</td>
<td><button onclick="editProduct(1)">수정</button></td>
</tr>
  </tbody>
</table> 
  <p>상품명, 판매가격, 재고 수량을 관리하는 곳입니다.</p>
</div>
  
  <div class="orders">

    <h2>주문 관리</h2>

    <table>
      <thead>
        <tr>
          <th>주문일시</th>
          <th>주문번호</th>
          <th>고객</th>
          <th>전화번호</th>
          <th>상품</th>
          <th>수량</th>
          <th>금액</th>
          <th>상태</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td colspan="8" id="ordersBody">
            Google Sheets 주문 데이터를 연결할 준비가 되었습니다.
          </td>
        </tr>
      </tbody>

    </table>

  </div>

</div>
<script>
const ORDER_API = "https://script.google.com/macros/s/AKfycbxUbqudSHEM8-jtcQUTLn4847WyZxCrwb5fUCyeAXDHwXxS3rG33D7pUAbm184cVLeClQ/exec";
  let adminPassword = "";

async function adminLogin() {
const password = document.getElementById("loginPassword").value;
  if (!password) return;

  const response = await fetch(
    ORDER_API + "?action=getOrders&password=" + encodeURIComponent(password)
  );
  const result = await response.json();

  if (result.error) {
    alert("비밀번호가 올바르지 않습니다.");
    return;
  }

  adminPassword = password;
document.getElementById("loginScreen").style.display = "none";
document.getElementById("adminContent").style.display = "block";
await loadProducts();
  await loadOrders();
}

async function loadOrders() {
  try {
    const response = await fetch(ORDER_API + "?action=getOrders&password=" + encodeURIComponent(adminPassword));
    const orders = await response.json();
   const validOrders = orders.filter(order => order.orderNumber && order.orderNumber.startsWith("CTM-"));
const newOrders = validOrders.filter(order => order.status === "신규주문");

document.getElementById("newOrders").textContent = newOrders.length + "건";
 const today = new Date().toISOString().slice(0, 10);
const todayOrders = validOrders.filter(order => String(order.date).slice(0, 10) === today);

document.getElementById("todayOrders").textContent = todayOrders.length + "건";   
const todaySales = todayOrders.reduce((sum, order) => sum + Number(order.total || 0), 0);

document.getElementById("todaySales").textContent = "₩" + todaySales.toLocaleString();
    
   const tbody = document.getElementById("ordersBody").parentElement.parentElement;
    tbody.innerHTML = "";

    orders.forEach(order => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${order.date || ""}</td>
        <td>${order.orderNumber || ""}</td>
        <td>${order.name || ""}</td>
        <td>${order.phone || ""}</td>
        <td>${order.products || ""}</td>
        <td>${order.quantity || ""}</td>
        <td>₩${Number(order.total || 0).toLocaleString()}</td>
        <td>
  <select onchange="updateOrderStatus('${order.orderNumber}', this.value)">
    <option value="신규주문" ${order.status === "신규주문" ? "selected" : ""}>신규주문</option>
    <option value="주문확인" ${order.status === "주문확인" ? "selected" : ""}>주문확인</option>
    <option value="배송중" ${order.status === "배송중" ? "selected" : ""}>배송중</option>
    <option value="배송완료" ${order.status === "배송완료" ? "selected" : ""}>배송완료</option>
  </select>
</td>
      `;

      tbody.appendChild(tr);
    });
  } catch (error) {
    console.error("주문 불러오기 오류:", error);
  }
}

async function updateOrderStatus(orderNumber, status) {
  try {
    const params = new URLSearchParams({
     password: adminPassword, 
      action: "updateStatus",
      orderNumber: orderNumber,
      status: status
    });

    await fetch(ORDER_API, {
      method: "POST",
      mode: "no-cors",
      body: params
    });

    alert("상태 변경 요청을 보냈습니다. 새로고침 후 확인해 주세요.");
    await loadOrders();
  } catch (error) {
    alert("상태 변경 요청 중 오류가 발생했습니다.");
    console.error(error);
  }
}

function adminLogout() {
  adminPassword = "";
  document.getElementById("loginPassword").value = "";
  document.getElementById("adminContent").style.display = "none";
  document.getElementById("loginScreen").style.display = "block";
}

async function editProduct(index) {
const products = window.currentProducts || [];

  const product = products[index];
  if (!product) return;

  const price = prompt(product.name + "\n새 판매가격을 입력하세요.", product.price);
  if (price === null) return;

  const stock = prompt(product.name + "\n재고 수량을 입력하세요.", "100");
  if (stock === null) return;

  if (price.trim() === "" || stock.trim() === "" ||
      !Number.isFinite(Number(price)) ||
      !Number.isInteger(Number(stock)) ||
      Number(price) < 0 || Number(stock) < 0) {
    alert("가격과 재고를 올바른 숫자로 입력해 주세요.");
    return;
  }

  if (!adminPassword) {
    alert("관리자 로그인이 필요합니다.");
    return;
  }

  const data = new URLSearchParams();
  data.append("action", "saveProduct");
  data.append("password", adminPassword);
  data.append("index", index);
  data.append("price", price);
  data.append("stock", stock);

  try {
    await fetch(ORDER_API, {
      method: "POST",
      mode: "no-cors",
      body: data
    });

    alert("저장 요청을 보냈습니다. Google Sheets에서 저장 결과를 확인해 주세요.");
  } catch (error) {
    alert("저장 요청 중 오류가 발생했습니다.");
  }
}

async function loadProducts() {
  try {
    const url = ORDER_API
      + "?action=getProducts&password="
      + encodeURIComponent(adminPassword);

    const response = await fetch(url);
    const result = await response.json();
window.currentProducts = result.products || [];
    if (!result.success) {
      console.error("상품 조회 실패:", result);
      return;
    }


const rows = document.querySelectorAll(
  "#productList tr"
);


    result.products.forEach((product, index) => {
      const row = rows[index];
      if (!row) return;

      row.cells[1].textContent =
        "₩" + Number(product.price).toLocaleString("ko-KR");

      row.cells[2].textContent =
        Number(product.stock).toLocaleString("ko-KR") + "개";
    });
  } catch (error) {
    console.error("상품 정보를 불러오지 못했습니다.", error);
  }
}
  
</script>

</div>
</body>
</html>
